[package]
name = "eduforge-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "rust_decimal", "chrono", "json", "macros"] }
rust_decimal = { version = "1", features = ["serde", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
digest = "0.10"
hex = "0.4"
base64 = "0.22"
rsa = "0.9"
aes-gcm = "0.10"
async-nats = { version = "0.50", features = ["jetstream"] }
thiserror = "2"
async-trait = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
http = "1"
bytes = "1"
generic-array = "0.14"
tokio-stream = "0.1"
url = "2"
argon2 = "0.5"
rand = "0.8"
dotenvy = "0.15"

[profile.release]
lto = true
codegen-units = 1
