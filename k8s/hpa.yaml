# P95 < 200ms 的容量规划: 回调热路径 (验签 + 锁订单 + 写库) 目标 P95 80ms,
# 20% CPU 余量给 429 退避与锁等待。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eduforge-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eduforge-core
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
